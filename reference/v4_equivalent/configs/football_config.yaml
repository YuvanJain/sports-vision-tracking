# Football Pipeline Configuration
sport: "football"

video:
  path: "Data/Football.mp4"
  native_fps: 25.0
  resolution: [1920, 1080] # [width, height]

# 10-Minute Target Deliverable Segment
# Strictly zero-based, end-exclusive: [start_frame, end_frame)
segment:
  start_frame: 1500
  end_frame: 16500
  total_frames: 15000       # 16500 - 1500 = 15,000 frames
  start_time: "00:01:00"    # 1500 / 25.0 = 60.0s
  duration_sec: 600.0       # 15000 / 25.0 = 600.0s (10 min 00s)

# 5-Chunk Checkpoint Partitioning (120s / 3,000 frames per chunk)
chunks:
  - id: 1
    start_frame: 1500
    end_frame: 4500
    expected_frames: 3000
  - id: 2
    start_frame: 4500
    end_frame: 7500
    expected_frames: 3000
  - id: 3
    start_frame: 7500
    end_frame: 10500
    expected_frames: 3000
  - id: 4
    start_frame: 10500
    end_frame: 13500
    expected_frames: 3000
  - id: 5
    start_frame: 13500
    end_frame: 16500
    expected_frames: 3000

# Benchmark Sample Segment (30 seconds = 750 frames)
benchmark_sample:
  start_frame: 1500
  end_frame: 2250           # [1500, 2250) = 750 frames
  expected_frames: 750

tracking:
  output_dir: "outputs/football"
  # More pixels for distant people; benchmark T4 throughput on short trials.
  imgsz: 960
  nms_iou: 0.60
  bytetrack:
    track_high_thresh: 0.25
    track_low_thresh: 0.10
    new_track_thresh: 0.40
    track_buffer: 60
    match_thresh: 0.80
    fuse_score: true
  ball_confidence: 0.30
  ball_fallback_imgsz: 1280
  ball_tiles: true
  ball_tile_confidence: 0.40
  pitch:
    enabled: true
    hsv_low: [25, 35, 30]
    hsv_high: [95, 255, 255]
    min_area_fraction: 0.12
    margin_cells: 11
    boundary_grace_frames: 3
    boundary_grace_iou: 0.30
    min_confirmed_frames: 5
  classification:
    min_color_fraction: 0.30
    min_color_margin: 0.15
    min_votes: 5
    vote_fraction: 0.85
  # OpenCV HSV ranges for this match. Red wraps around hue 179.
  jersey_hsv:
    A: [[[0, 75, 45], [12, 255, 255]], [[165, 75, 45], [179, 255, 255]]]
    B: [[[100, 65, 40], [145, 255, 255]]]
    referee: [[[43, 115, 110], [78, 255, 255]]]
