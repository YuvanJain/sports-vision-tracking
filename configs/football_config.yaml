# Football Pipeline Configuration
sport: "football"

video:
  path: "Data/Football.mp4"
  native_fps: 25.0
  resolution: [1920, 1080] # [width, height]

# 10-Minute Target Deliverable Segment
# Strictly zero-based, end-exclusive: [start_frame, end_frame)
segment:
  start_frame: 1500
  end_frame: 16500
  total_frames: 15000       # 16500 - 1500 = 15,000 frames
  start_time: "00:01:00"    # 1500 / 25.0 = 60.0s
  duration_sec: 600.0       # 15000 / 25.0 = 600.0s (10 min 00s)

# 5-Chunk Checkpoint Partitioning (120s / 3,000 frames per chunk)
chunks:
  - id: 1
    start_frame: 1500
    end_frame: 4500
    expected_frames: 3000
  - id: 2
    start_frame: 4500
    end_frame: 7500
    expected_frames: 3000
  - id: 3
    start_frame: 7500
    end_frame: 10500
    expected_frames: 3000
  - id: 4
    start_frame: 10500
    end_frame: 13500
    expected_frames: 3000
  - id: 5
    start_frame: 13500
    end_frame: 16500
    expected_frames: 3000

# Benchmark Sample Segment (30 seconds = 750 frames)
benchmark_sample:
  start_frame: 1500
  end_frame: 2250           # [1500, 2250) = 750 frames
  expected_frames: 750

